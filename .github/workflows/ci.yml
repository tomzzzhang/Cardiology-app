name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Every other check builds at `/`; Pages builds at `/<repository-name>/`.
      # Without this step a hardcoded root-absolute URL would only surface on
      # the deployed site, after a merge to `main`.
      - name: Production base path
        run: npm run check:base-path

  packs:
    name: Pack schema and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate packs against schema v0
        run: npm run validate:packs

      - name: Licence and attribution completeness
        run: npm run check:provenance

      - name: Stub assets are reproducible
        run: |
          npm run gen:stub-assets
          if ! git diff --quiet -- public/packs; then
            echo "::error::Regenerating stub assets changed the working tree."
            echo "Run 'npm run gen:stub-assets' and commit the result."
            git --no-pager diff --stat -- public/packs
            exit 1
          fi

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual suite
        run: npm run test:visual

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # Baselines are platform-specific and none are committed yet, so the
      # screenshot comparison skips itself (see playwright.config.ts). This
      # publishes Linux references generated on demand, so wave 1 can commit a
      # set that was produced by the same runner image that will check it.
      # No `|| true`: a partial or failed seed must not be uploaded as if it
      # were a usable baseline set.
      - name: Seed Linux screenshot baselines (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:visual:update

      - name: Upload generated baselines
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/visual/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: docs/ is read-only for workers
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"

          # docs/ arrives once, from the planning session, and is never touched
          # again by a worker. Until it exists on the base commit, this is that
          # initial sync and the guard stands down — but only for ADDITIONS.
          # A stand-down that lasted the whole life of the sync pull request
          # would let a later commit on the same branch edit the freshly synced
          # copies with the guard still green.
          if ! git cat-file -e "$base:docs" 2>/dev/null; then
            if git log --diff-filter=MDR --format=%H "$base"..HEAD -- docs/ | grep -q .; then
              echo "::error::This pull request modifies or deletes docs/ content it also introduces."
              echo "The initial sync may only ADD the privacy-scrubbed copies."
              git --no-pager log --diff-filter=MDR --oneline "$base"..HEAD -- docs/
              exit 1
            fi
            echo "docs/ does not exist on the base commit — initial sync, additions only."
            exit 0
          fi

          if git diff --name-only "$base"...HEAD -- docs/ | grep -q .; then
            echo "::error::This PR changes docs/. Those are one-way, privacy-scrubbed copies"
            echo "synced from the planning session; workers never edit them."
            git --no-pager diff --name-only "$base"...HEAD -- docs/
            exit 1
          fi
          echo "docs/ unchanged."

      - name: No local absolute paths committed
        run: |
          if git grep -nIE '(/Users/[A-Za-z0-9._-]+/|[A-Za-z]:\\Users\\|/home/[A-Za-z0-9._-]+/)' \
               -- . ':(exclude)package-lock.json' ':(exclude).github/workflows/ci.yml'; then
            echo "::error::A machine-specific absolute path is committed. Remove it."
            exit 1
          fi
          echo "No local absolute paths found."

      - name: No Drive-synced tree references
        run: |
          if git grep -nIiE 'CloudStorage|GoogleDrive|My Drive|OneDrive' \
               -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::A reference to a Drive-synced planning tree is committed."
            echo "The repository must live outside any synced tree and must not point back into one."
            exit 1
          fi
          echo "No Drive references found."
