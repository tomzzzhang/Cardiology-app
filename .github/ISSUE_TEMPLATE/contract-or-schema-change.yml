name: Contract or schema change request
description: Request a change to a module contract or to the content-pack schema. Workers do not make these changes themselves.
title: '[contract] '
labels: ['contract-change', 'needs-planning-decision']
body:
  - type: markdown
    attributes:
      value: |
        **Workers never change schema or contracts.** Interface changes route back through the
        planning session and are logged there (`WORKFLOW.md`, item 3). Open this issue, keep working
        against the current contract, and do not pre-emptively implement the change.

        Content-pack schema v0 is **PROVISIONAL**. Exactly one controlled revision (v1) is expected
        after the wave 1 technical slice review. If this request is "we learned something in the
        slice", say so — it may already be queued for that revision.

  - type: dropdown
    id: target
    attributes:
      label: What needs to change
      options:
        - Content-pack schema (src/schema, docs/build_plan.md "Content pack schema")
        - contracts/pack-loader.md
        - contracts/viewer-core.md
        - contracts/echo-renderer.md
        - contracts/view-rail-sweep-scrubber.md
        - contracts/provenance-ui.md
        - contracts/authoring-mode.md
        - contracts/app-shell.md
    validations:
      required: true

  - type: textarea
    id: blocked
    attributes:
      label: What is blocked without it
      description: The concrete thing that cannot be built or cannot be built correctly today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The smallest change that unblocks the work. Field names and types if it is a schema change.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround in the meantime
      description: How the blocked work proceeds — or why it genuinely cannot — until the planning session decides.

  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary check
      options:
        - label: This does not merge the free anatomical cutter and the vetted echo wedge, or move free-cut state into `views[]`.
          required: true
        - label: This does not change product scope — `docs/mvp_scope.md` is LOCKED and scope changes are logged in the doc home first.
          required: true
        - label: I have not implemented this change; the branch still codes against the current contract.
          required: true
