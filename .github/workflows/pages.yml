name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # The spec says Pages deploys from `main`. `workflow_dispatch` can be aimed
    # at any branch, so the branch is checked here in code rather than relying
    # on the `github-pages` environment's deployment-branch setting, which is
    # repository state and can be changed independently.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `enablement: true` lets the first run on `main` turn Pages on and set its
      # source to GitHub Actions, so no manual repository-settings step is
      # needed. Merging to `main` therefore publishes the site publicly.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # Gate the deploy on the quality checks, not just the pack checks. `ci.yml`
      # runs on push to `main` concurrently with this workflow and does not block
      # it, so without these steps a commit that regresses on `main` would still
      # publish. Reproduced here rather than chained on `workflow_run` so the
      # deploy stays a single, readable pipeline.
      #
      # Deliberately NOT reproduced: the Playwright visual suite (needs a browser
      # download, and its screenshot comparison is skipped until baselines land)
      # and the pull-request-only docs/ guard. Whether the deploy should also
      # wait on the full CI workflow is an open owner decision.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Validate packs against schema v0
        run: npm run validate:packs

      - name: Licence and attribution completeness
        run: npm run check:provenance

      # A project site is served from /<repository-name>/. The repository name
      # is read from the event so no path is hardcoded anywhere in the repo.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages serves static files only: an unknown path 404s instead of falling
      # back to index.html. Deep links use query params (?a=&v=&s=) so the SPA
      # never needs a path fallback; this copy is belt-and-braces for a
      # mistyped URL landing on a styled page rather than the stock 404.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
