name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # The spec says Pages deploys from `main`. `workflow_dispatch` can be aimed
    # at any branch, so the branch is checked here in code rather than relying
    # on the `github-pages` environment's deployment-branch setting, which is
    # repository state and can be changed independently.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `enablement: true` lets the first run on `main` turn Pages on and set its
      # source to GitHub Actions, so no manual repository-settings step is
      # needed. Merging to `main` therefore publishes the site publicly.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # `ci.yml` is intentionally lightweight on `dev`. This workflow is the
      # release boundary and must pass the complete gate before anything reaches
      # the public URL.
      - name: Fast platform gate
        run: npm run check:fast

      - name: Content gate
        run: npm run check:content

      - name: Stub assets are reproducible
        run: npm run check:stub-assets

      - name: Production base path
        run: npm run check:base-path

      - name: No local absolute paths committed
        run: npm run check:absolute-paths

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Desktop browser suite
        run: npm run test:visual
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # The deploy is the one place a licence-blocked pack could reach a public
      # URL, so the build output is asserted here rather than trusted. Runs
      # against the exact base-path artifact the browser suite exercised.
      - name: Only published packs are in the build
        run: npm run check:published-packs

      - name: Authoring is absent from the learner build
        run: npm run check:authoring-absent

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
