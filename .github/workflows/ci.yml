name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Unpublished packs are licence-blocked. The build filter removes them;
      # this asserts it worked, so a regression is caught on `dev` rather than
      # first appearing on a public URL.
      - name: Only published packs are in the build
        run: npm run check:published-packs

      # Every other check builds at `/`; Pages builds at `/<repository-name>/`.
      # Without this step a hardcoded root-absolute URL would only surface on
      # the deployed site, after a merge to `main`.
      - name: Production base path
        run: npm run check:base-path

  packs:
    name: Pack schema and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate packs against schema v0
        run: npm run validate:packs

      - name: Licence and attribution completeness
        run: npm run check:provenance

      - name: Stub assets are reproducible
        run: |
          npm run gen:stub-assets
          if ! git diff --quiet -- public/packs; then
            echo "::error::Regenerating stub assets changed the working tree."
            echo "Run 'npm run gen:stub-assets' and commit the result."
            git --no-pager diff --stat -- public/packs
            exit 1
          fi

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual suite
        run: npm run test:visual

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # Baselines are platform-specific and none are committed yet, so the
      # screenshot comparison skips itself (see playwright.config.ts). This
      # publishes Linux references generated on demand, so a later checkpoint can
      # commit a set produced by the same runner image that will check it.
      # No `|| true`: a partial or failed seed must not be uploaded as if it
      # were a usable baseline set.
      - name: Seed Linux screenshot baselines (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:visual:update

      - name: Upload generated baselines
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/visual/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A committed absolute path breaks the build on every other machine, and
      # leaks the layout of whoever committed it.
      - name: No local absolute paths committed
        run: |
          if git grep -nIE '(/Users/[A-Za-z0-9._-]+/|[A-Za-z]:\\Users\\|/home/[A-Za-z0-9._-]+/)' \
               -- . ':(exclude)package-lock.json' ':(exclude).github/workflows/ci.yml'; then
            echo "::error::A machine-specific absolute path is committed. Remove it."
            exit 1
          fi
          echo "No local absolute paths found."
