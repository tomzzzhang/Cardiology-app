name: Content checks

on:
  push:
    branches: [dev, main]
    paths:
      - public/packs/**
      - src/packs/**
      - src/schema/**
      - pipeline/**
      - evidence/view-candidates/**
      - evidence/body-context/**
      - evidence/acoustic-windows/**
      - public/body-context/**
      - .gitattributes
      - scripts/validate-packs.ts
      - scripts/check-provenance.ts
      - scripts/check-view-candidates.ts
      - scripts/check-frame-decoupling.ts
      - scripts/check-pack-budget.ts
      - scripts/check-probe-on-skin.ts
      - scripts/ingest-authoring-export.ts
      - scripts/make-stub-assets.mjs
      - scripts/lib/**
      - src/authoring/exportFile.ts
      - package.json
      - package-lock.json
      - .github/workflows/content.yml
  pull_request:
    paths:
      - public/packs/**
      - src/packs/**
      - src/schema/**
      - pipeline/**
      - evidence/view-candidates/**
      - evidence/body-context/**
      - evidence/acoustic-windows/**
      - public/body-context/**
      - .gitattributes
      - scripts/validate-packs.ts
      - scripts/check-provenance.ts
      - scripts/check-view-candidates.ts
      - scripts/check-frame-decoupling.ts
      - scripts/check-pack-budget.ts
      - scripts/check-probe-on-skin.ts
      - scripts/ingest-authoring-export.ts
      - scripts/make-stub-assets.mjs
      - scripts/lib/**
      - src/authoring/exportFile.ts
      - package.json
      - package-lock.json
      - .github/workflows/content.yml
  workflow_dispatch:

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content:
    name: Pack integrity and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Content gate
        run: npm run check:content

      - name: Stub assets are reproducible
        run: npm run check:stub-assets
