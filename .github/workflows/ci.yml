name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
    inputs:
      seed_visual_baselines:
        description: Generate Linux screenshot baselines instead of running the comparison suite
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Platform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fast platform gate
        run: npm run check:fast

      - name: Build
        run: npm run build

      - name: Build primary authoring surface
        run: npm run build:authoring

  visual:
    name: Desktop browser suite
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run desktop browser suite
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.seed_visual_baselines }}
        run: npm run test:visual

      # Desktop baselines are platform-specific and none are committed yet.
      # Phone/touch is a separate paused workstream, not a current gate.
      - name: Seed Linux desktop screenshot baselines (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_visual_baselines }}
        run: npm run test:visual:update

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload generated baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_visual_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/visual/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No local absolute paths committed
        run: node scripts/check-absolute-paths.mjs
