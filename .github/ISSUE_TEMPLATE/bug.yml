name: Bug
description: Something in the engine, a pack, or CI behaves incorrectly.
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        For a *content* problem — a view that is wrong, mislabelled, or not learnable-from — use a
        vetting note on the work item for that pack instead. This template is for engine, pack
        tooling, and CI defects.

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, or a deep link (`?a=…&v=…&s=…`), plus the pack id if a pack is involved.
      render: text
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where
      multiple: true
      options:
        - Deployed Pages site
        - Local dev server
        - CI (typecheck / lint / tests)
        - CI (pack schema validation)
        - CI (licence + provenance completeness)
        - CI (visual regression)
        - Pages deployment
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: iOS Safari 18, phone portrait
